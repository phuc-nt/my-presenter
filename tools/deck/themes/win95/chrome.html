<!-- stage:before -->
<div class="desk" id="desk"></div>
<!-- stage:after -->
<div id="taskbar">
  <span class="btn" id="startbtn"><img class="px" id="starticon" alt=""><span id="startname">Start</span></span>
  <div class="sep"></div>
  <span class="btn" id="task"><img class="px" id="taskicon" alt=""><span id="taskname"></span></span>
  <div class="tray"><img class="px" id="trayicon" alt=""><span id="pg"></span></div>
</div>
<div id="zoom"></div>
<img id="cursor" class="px" src="{{ICON:cursor}}" alt="">
<div id="boot"></div>
<!-- overlays -->
<div class="ov" id="notes"><div class="tb"><img class="px" src="{{ICON:chat}}" alt=""><span class="t">{{T:notes}}</span><div class="tbb"><i class="x" data-close></i></div></div>
  <div class="nh"><span id="ntitle"></span><span id="nstep"></span></div><div class="nb" id="nbody"></div><div class="nx" id="nnext"></div></div>
<div class="ov" id="grid"><div class="tb"><img class="px" src="{{ICON:folder}}" alt=""><span class="t">{{T:grid}}</span><div class="tbb"><i class="x" data-close></i></div></div><div class="gb" id="gridbody"></div></div>
<div class="ov" id="help"><div class="tb"><img class="px" src="{{ICON:help}}" alt=""><span class="t">{{T:help}}</span><div class="tbb"><i class="x" data-close></i></div></div>
  <div class="hb">{{HELP}}</div></div>
<div id="hint">{{T:hint}}</div>
