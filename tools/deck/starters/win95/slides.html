<!-- Theme win95. Slide đầu: .slide.cover > .win. Slide nội dung: .win.main > .tb (thanh tiêu đề) + .wb (nội dung).
     Biểu tượng: ICON:ten trong hai dấu ngoặc nhọn kép (có sẵn trong theme, hoặc assets/icons). Ảnh riêng: assets/img, gọi bằng IMG:ten. -->
<section class="slide cover" data-task="Mở đầu" data-icon="book">
  <div class="win"><div class="tb"><img class="px" src="{{ICON:book}}" alt=""><span class="t">Mở đầu</span><div class="tbb"><i class="min"></i><i class="max"></i><i class="x"></i></div></div>
    <div class="wb" style="padding:44px 56px">
      <h1>Tên bài trình bày</h1>
      <p class="tag" data-step="0" data-fx="fade">Một câu nói rõ người nghe sẽ nhận được gì.</p>
    </div></div>
</section>

<section class="slide" data-task="Ba ý chính" data-icon="folder">
  <div class="win main"><div class="tb"><img class="px" src="{{ICON:folder}}" alt=""><span class="t">Ba ý chính</span><div class="tbb"><i class="min"></i><i class="max"></i><i class="x"></i></div></div>
    <div class="wb">
      <h2>Ba ý chính</h2>
      <div class="bl">
        <div class="b" data-step="1" data-fx="pop"><span class="n">1</span><p><b>Ý thứ nhất</b>: nói gọn trong một dòng</p></div>
        <div class="b" data-step="2" data-fx="pop"><span class="n">2</span><p><b>Ý thứ hai</b>: nói gọn trong một dòng</p></div>
        <div class="b" data-step="3" data-fx="pop"><span class="n">3</span><p><b>Ý thứ ba</b>: nói gọn trong một dòng</p></div>
      </div>
    </div></div>
</section>
