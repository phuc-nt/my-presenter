<!--
Win95 pixel — caption skin (vi-explainer-video preset).

  Built from glass-keynote's caption-skin.html: the script, hooks and reserved holes are
  unchanged; only the look differs, plus a static taskbar drawn once under the captions.
  Token contract: --cap-ink · --cap-canvas · --cap-accent · --cap-accent-2 ·
  --font-display · --font-body · --cap-band-top · --cap-band-height.

  Visual: a persistent grey taskbar (Start button with the shelf pixel icon, a pressed task
  button naming the product, a sunken tray with the guest user) along the bottom 56px; captions
  sit above it in a pale-yellow tooltip box with a 2px black border, Be Vietnam Pro 700.
  Upcoming words grey, the current word navy, spoken words black.

  Per project, after build-frame: replace the text of #w95-task-label with the product name
  (≤ 16 characters fits the 300px button). Needs the preset's icons in assets/images/icons/.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  /* ---- persistent taskbar (bottom 56px of the band) ---- */
  .w95-taskbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    background: #c0c0c0;
    box-shadow: inset 0 2px #dfdfdf, inset 0 4px #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 0;
    box-sizing: border-box;
    font-family: var(--font-body, "Be Vietnam Pro"), system-ui, sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #000000;
  }
  .w95-btn {
    height: 42px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: #c0c0c0;
    box-shadow: inset -2px -2px #000, inset 2px 2px #fff, inset -4px -4px #808080, inset 4px 4px #dfdfdf;
    box-sizing: border-box;
    white-space: nowrap;
  }
  .w95-btn img {
    image-rendering: pixelated;
    display: block;
  }
  .w95-start {
    font-size: 24px;
  }
  .w95-task {
    width: 300px;
    background: repeating-conic-gradient(#ffffff 0 25%, #c0c0c0 0 50%) 0 0 / 4px 4px;
    box-shadow: inset 2px 2px #000, inset -2px -2px #fff, inset 4px 4px #808080;
    font-weight: 700;
  }
  .w95-sep {
    width: 4px;
    height: 42px;
    box-shadow: inset 2px 0 #808080, inset -2px 0 #fff;
  }
  .w95-tray {
    margin-left: auto;
    height: 42px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    box-shadow: inset 2px 2px #808080, inset -2px -2px #fff;
    font-weight: 500;
    box-sizing: border-box;
  }
  .w95-tray img {
    image-rendering: pixelated;
    display: block;
  }

  /* ---- caption area: the band minus the taskbar ---- */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: calc(var(--cap-band-height, 180px) - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* Win95 tooltip box */
  .caption-pill {
    max-width: 82%;
    padding: 8px 26px 10px;
    background: #ffffe1;
    border: 2px solid #000000;
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.06em 0.26em;
    font-family: var(--font-body, "Be Vietnam Pro"), system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 2.1vw, 40px);
    line-height: 1.3;
  }

  /* upcoming — mid grey */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.04em;
    color: #8a8a7a;
  }
  /* current — title-bar navy */
  .caption-word.is-active {
    color: #000080;
  }
  /* spoken — black ink */
  .caption-word.is-spoken {
    color: var(--cap-ink, #000000);
  }
  .caption-word.cap-brand {
    color: #000080;
  }
  .caption-word.cap-num {
    color: #000080;
  }
  .caption-word.cap-cta {
    color: #000080;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(30px, 5vw, 40px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div class="w95-taskbar">
      <div class="w95-btn w95-start"><img src="assets/images/icons/shelf.svg" width="32" height="26" alt="" />Start</div>
      <div class="w95-sep"></div>
      <div class="w95-btn w95-task"><img src="assets/images/icons/book.svg" width="32" height="30" alt="" /><span id="w95-task-label">Giới thiệu</span></div>
      <div class="w95-tray"><img src="assets/images/icons/user.svg" width="26" height="24" alt="" />Khách</div>
    </div>
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
